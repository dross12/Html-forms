<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arranging the Widths</title>
    <link rel="stylesheet" href="arranging-the-widths.css">
</head>
<body>
    <form action="#" method="POST">
        <fieldset>
            <legend>Rent Audi Vehicles</legend>

            <div class="field-group">
                <label for="name">Named</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">
            </div>

            <div class="field-group">
                <label for="vehicle">Select</label>
                <select id="vehicle" name="vehicle">
                    <option value="audi-80">Audi 80</option>
                </select>
            </div>

            <div class="field-group">
                <label>Select</label>
                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>
            </div>
        </fieldset>
    </form>
</body>
</html>
